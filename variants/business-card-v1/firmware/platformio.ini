; PlatformIO project for Insert Coin business-card-v1
; Four environments sharing a common [env] base:
;   - bringup         : per-subsystem smoke tests (LEDs, mic, NFC, sleep)
;   - production      : full interactive firmware (no NFC writes)
;   - production-nfc  : production + post-reveal I2C patch of the ST25DV
;                       tag URL so phone scans pick up the fortune
;   - production-pond : production-nfc pointed at davidyang.work/p, with a
;                       5-minute live window and retried I2C writes
;
; Environments are additive. production and production-nfc are frozen: any
; card already flashed with them keeps working exactly as it does today,
; and adding the pond never requires touching either.
;
; Sources live under bringup/src/, production/src/, production-nfc/src/,
; production-pond/src/.

[platformio]
default_envs = production-nfc
; src_dir is a [platformio]-section-only option; per-env source selection is
; done with build_src_filter below.
src_dir = .

; ─── Shared defaults ────────────────────────────────────────────────────────
[env]
platform        = atmelmegaavr
framework       = arduino
board           = ATtiny1616

; 10 MHz internal oscillator. Friendlier to the CR2032 than 20 MHz.
board_build.f_cpu = 10000000L

; Brown-Out Detector disabled. BOD costs ~20 uA continuously and would dominate
; the sleep current; we'd rather the card gracefully dim as the coin cell sags
; than reset-loop near end of life.
board_hardware.bod    = disabled
board_hardware.eesave = yes
board_hardware.uart   = no_bootloader   ; UPDI flashing, no bootloader on chip

; Use TCB0 for millis() so TCD0 stays free for high-res PWM on the LED matrix.
board_build.millis_timer = TCB0

; ─── Default programmer: SerialUPDI via FTDI USB-serial ─────────────────────
; Wiring:  FTDI TX --[4.7k]--+-- UPDI
;                            |
;          FTDI RX -----------'
;          FTDI GND ------------ GND
; Do NOT feed Vcc from the FTDI; power the card from its CR2032 while flashing.
upload_protocol = serialupdi
upload_speed    = 230400
; upload_port = /dev/cu.usbserial-XXXXXXXX   ; uncomment & set, or pass --upload-port

; ─── Fallback programmer: jtag2updi on an Arduino Nano ──────────────────────
; To use, override these in the env block below:
;   upload_protocol = jtag2updi
;   upload_speed    = 19200
;   upload_port     = /dev/cu.usbserial-XXXX   ; the Nano's USB-serial
; Wiring: Nano D6 --[4.7k]-- UPDI ; Nano GND -- GND

; ─── Environment: bring-up firmware ─────────────────────────────────────────
[env:bringup]
build_src_filter = -<*> +<bringup/src/>
build_flags =
    -DINSERT_COIN_BRINGUP
    -DF_CPU=10000000L

; ─── Environment: production firmware ───────────────────────────────────────
[env:production]
build_src_filter = -<*> +<production/src/>
build_flags =
    -DINSERT_COIN_PRODUCTION
    -DF_CPU=10000000L

; ─── Environment: production-nfc firmware ──────────────────────────────────
; Identical to production but writes the fortune result to the ST25DV04K
; over I2C after the reveal, so a phone tap surfaces the fortune-coded URL.
; See production-nfc/src/ndef.{h,cpp} and config.h's NDEF_* section.
[env:production-nfc]
build_src_filter = -<*> +<production-nfc/src/>
build_flags =
    -DINSERT_COIN_PRODUCTION
    -DINSERT_COIN_NFC
    -DF_CPU=10000000L

; ─── Environment: production-pond firmware ─────────────────────────────────
; production-nfc pointed at the pond (davidyang.work/p) instead of the plain
; site. Three differences that matter, all documented in production-pond/
; src/main.cpp:
;   * 300 s live-URL window instead of 120 s -- the common real failure is
;     tapping too late. Needed 16-bit NDEF_EXPIRY_SECONDS and a 16-bit
;     sleep_timed_seconds(); at uint8_t, 300 wraps to 44.
;   * NDEF writes retry. RF beats I2C on the ST25DV, so a phone resting on
;     the card can NACK the patch and leave the previous fortune live.
;   * Digit offset 0x001E (path gained "/p"). The per-card "&c=" suffix sits
;     after the digit, so every card runs this identical binary.
[env:production-pond]
build_src_filter = -<*> +<production-pond/src/>
; ══ THE PROGRAMMER, NOT WHATEVER SPEAKS SERIAL ══
; Auto-detect picks the first port it likes, and on a Mac that list
; includes every paired Bluetooth device. It chose a Bose speaker, spent
; seventeen seconds failing to open a UPDI link with it, and reported
; "double check the connections" — which sends you looking at the wiring
; for a fault that is not there.
;
; The SerialUPDI adapter always enumerates as cu.usbserial-*. A glob
; rather than the exact name, because the trailing digits change with the
; USB port it is plugged into.
upload_port = /dev/cu.usbserial*
; card_identity and ndef_record live in shared/firmware because they are
; derived TWICE — here in C, and on the host in TypeScript — and a
; disagreement would make every card unknown to the server at once. One
; definition, compiled for both. See shared/firmware/card-identity/.
lib_extra_dirs = ../../../shared/firmware
build_flags =
    -DINSERT_COIN_PRODUCTION
    -DINSERT_COIN_NFC
    -DINSERT_COIN_POND
    -DF_CPU=10000000L
