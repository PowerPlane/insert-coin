; PlatformIO project for Insert Coin business-card-v1
; Two environments sharing a common [env] base:
;   - bringup    : per-subsystem smoke tests (LEDs, mic, NFC, sleep)
;   - production : full interactive firmware
;
; Actual source files live under bringup/src/ and production/src/.
; They are added in a later session.

[platformio]
default_envs = bringup
; src_dir is a [platformio]-section-only option; per-env source selection is
; done with build_src_filter below.
src_dir = .

; ─── Shared defaults ────────────────────────────────────────────────────────
[env]
platform        = atmelmegaavr
framework       = arduino
board           = ATtiny1616

; 10 MHz internal oscillator. Friendlier to the CR2032 than 20 MHz.
board_build.f_cpu = 10000000L

; Brown-Out Detector disabled. BOD costs ~20 uA continuously and would dominate
; the sleep current; we'd rather the card gracefully dim as the coin cell sags
; than reset-loop near end of life.
board_hardware.bod    = disabled
board_hardware.eesave = yes
board_hardware.uart   = no_bootloader   ; UPDI flashing, no bootloader on chip

; Use TCB0 for millis() so TCD0 stays free for high-res PWM on the LED matrix.
board_build.millis_timer = TCB0

; ─── Default programmer: SerialUPDI via FTDI USB-serial ─────────────────────
; Wiring:  FTDI TX --[4.7k]--+-- UPDI
;                            |
;          FTDI RX -----------'
;          FTDI GND ------------ GND
; Do NOT feed Vcc from the FTDI; power the card from its CR2032 while flashing.
upload_protocol = serialupdi
upload_speed    = 230400
; upload_port = /dev/cu.usbserial-XXXXXXXX   ; uncomment & set, or pass --upload-port

; ─── Fallback programmer: jtag2updi on an Arduino Nano ──────────────────────
; To use, override these in the env block below:
;   upload_protocol = jtag2updi
;   upload_speed    = 19200
;   upload_port     = /dev/cu.usbserial-XXXX   ; the Nano's USB-serial
; Wiring: Nano D6 --[4.7k]-- UPDI ; Nano GND -- GND

; ─── Environment: bring-up firmware ─────────────────────────────────────────
[env:bringup]
build_src_filter = -<*> +<bringup/src/>
build_flags =
    -DINSERT_COIN_BRINGUP
    -DF_CPU=10000000L

; ─── Environment: production firmware ───────────────────────────────────────
[env:production]
build_src_filter = -<*> +<production/src/>
build_flags =
    -DINSERT_COIN_PRODUCTION
    -DF_CPU=10000000L
