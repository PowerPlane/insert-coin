name = "pond"
main = "src/worker/index.ts"
compatibility_date = "2025-01-15"

# The pond gets its own subdomain. davidyang.work's apex stays on Cargo, so
# the pond cannot live at a path there — a Worker route needs the zone to be
# on Cloudflare, and taking the apex would mean moving the Cargo site too.
#
# custom_domain = true is the same mechanism already used for
# shop.byproductlab.com and mistmaker.byproductlab.com: Cloudflare creates
# the DNS record and issues the certificate. It requires davidyang.work to
# be a zone in the Cloudflare account first — see docs/pond/HOSTING.md.
routes = [
  { pattern = "ducky.davidyang.work", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pond"
database_id = "REPLACE_ME"   # wrangler d1 create pond

# Fires are lit by the server, never by a client — so there is nothing to
# farm and no griefing vector. This is the only thing that lights one.
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# Secrets (wrangler secret put <NAME>):
#   SESSION_SECRET  — HMAC key for session cookies and visitor hashes
#   ADMIN_PASSWORD  — the actual admin auth. The secret path is obscurity;
#                     URLs leak through history, logs and referrers.
