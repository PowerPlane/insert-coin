<!doctype html><meta charset="utf-8">
<title>pixelizer</title>
<body style="background:#111;color:#eee;font:12px ui-monospace,monospace">
<div id="out"></div>
<script>
const PAL = [
  null,          // 0 transparent
  "#FFCA00",     // 1 gold
  "#FFFFFF",     // 2 white (eye)
  "#FF8953",     // 3 bad body
  "#FF4B4B",     // 4 flame
];
const RGB = PAL.map(h => h ? [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)] : null);

function nearest(r,g,b){
  let best=1,bd=1e9;
  for(let i=1;i<RGB.length;i++){
    const d=(RGB[i][0]-r)**2+(RGB[i][1]-g)**2+(RGB[i][2]-b)**2;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

// Supersample SS× then take modal opaque colour per cell.
async function pixelize(url, N, SS=6){
  const img = new Image();
  img.src = url;
  await img.decode();
  const S = N*SS;
  const c = document.createElement("canvas");
  c.width=S; c.height=S;
  const x = c.getContext("2d");
  // fit preserving aspect, centred, with 1-cell breathing room
  const pad = SS*1;
  const avail = S - pad*2;
  const sc = Math.min(avail/img.width, avail/img.height);
  const w = img.width*sc, h = img.height*sc;
  x.drawImage(img, (S-w)/2, (S-h)/2, w, h);
  const d = x.getImageData(0,0,S,S).data;

  const grid = new Uint8Array(N*N);
  for(let gy=0; gy<N; gy++) for(let gx=0; gx<N; gx++){
    const counts = new Map(); let opaque=0, total=SS*SS;
    for(let sy=0; sy<SS; sy++) for(let sx=0; sx<SS; sx++){
      const px = (gx*SS+sx), py = (gy*SS+sy);
      const i = (py*S+px)*4;
      const a = d[i+3];
      if(a < 128) continue;
      opaque++;
      const k = nearest(d[i],d[i+1],d[i+2]);
      counts.set(k, (counts.get(k)||0)+1);
    }
    if(opaque/total < 0.42){ grid[gy*N+gx]=0; continue; }
    let bk=1,bv=-1;
    for(const [k,v] of counts) if(v>bv){bv=v;bk=k;}
    grid[gy*N+gx]=bk;
  }
  return grid;
}

function toRows(grid,N){
  const CH=".ABCD"; // 0..4
  const rows=[];
  for(let y=0;y<N;y++){
    let s="";
    for(let x=0;x<N;x++) s+=CH[grid[y*N+x]];
    rows.push(s);
  }
  return rows;
}

function render(rows,N,scale){
  const c=document.createElement("canvas");
  c.width=N*scale;c.height=N*scale;
  const x=c.getContext("2d");
  const CH=".ABCD";
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){
    const k=CH.indexOf(rows[y][xx]);
    if(k<=0)continue;
    x.fillStyle=PAL[k];
    x.fillRect(xx*scale,y*scale,scale,scale);
  }
  c.style.cssText="image-rendering:pixelated;background:#1b3a47;margin:4px;border:1px solid #345";
  return c;
}
